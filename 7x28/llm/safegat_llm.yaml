# configs/safegat_llm.yaml
#
# SafeGAT-LLM hyperparameters for inference (run_safegat.py) — 7x28 network.
# Training hyperparameters live in train.py directly.

llm:
  enabled: true
  mode: selective                   # "selective" | "always" | "never"

  # Uncertainty gate
  confidence_threshold: 0.02        # Q-margin tau — call LLM when delta_i < tau
  intervention_budget:  800         # max LLM calls for the full episode
  max_nodes_per_step:   1           # one serialized LLM call stream for Groq free tier

  # Safety shield
  min_green_hold: 3                 # min steps before a green phase may switch
  transition_confidence_threshold: 0.75 # below this, hold current phase

  # Logging
  log_file: "output/llm/safegat_decisions.jsonl"

  # Backend (override per-run if needed)
  llm_timeout:      20              # seconds per API call before abort
  fallback_to_rl:   false           # on LLM errors, hold current legal phase instead of RL
  fallback_policy:  "hold_current"

  # Groq free-tier llama-3.1-8b-instant is 30 RPM / 6K TPM.
  # 15s spacing gives ~4 RPM and leaves room for token-limit variability.
  min_call_interval_s: 15.0

  # Fall back to RL quickly if Groq reports a limit; cooldown suppresses retry storms.
  backoff_wait_s: 75.0

  max_backoff_retries: 1
  rate_limit_cooldown_steps: 60
  rate_limit_cooldown_s: 300

  # TPM gate — Groq free-tier llama-3.1-8b-instant hard cap is 6000 TPM.
  tpm_limit: 4500

  # Scenario detector thresholds
  queue_spike_threshold:               0.85
  zero_fraction_corruption_threshold:  0.90
  forecast_anomaly_threshold:          0.65
  forecast_horizon_steps:              3
  forecast_history_len:                4

  # Anomaly tags that trigger gate even if confidence is high
  anomaly_triggers:
    - emergency_vehicle
    - accident_flag
    - possible_packet_loss
    - nan_observation
    - queue_spike
    - forecast_anomaly
