# configs/safegat_llm.yaml
#
# SafeGAT-LLM hyperparameters for 4x4 inference and CityFlow datasets
# that reuse the 4x4 implementation, including Jinan and Hangzhou.

llm:
  enabled: true
  mode: selective # "selective" | "always" | "never"

  # Uncertainty gate
  confidence_threshold: 0.02 # Q-margin tau; call LLM when margin is below tau
  intervention_budget: 800 # max LLM calls for the full episode
  max_nodes_per_step: 1 # one serialized LLM call stream for Groq free tier
  intervention_rate: 0.0625 # K/N for 16-node grid
  failure_injection_rate: 0.0 # sweep 0.10/0.30/0.50/1.00
  risk_weights:
    uncertainty: 2.0
    anomaly: 1.5
    queue: 1.0
    waiting: 0.5
    safety: 1.0

  # Safety shield
  min_green_hold: 3
  transition_confidence_threshold: 0.75

  # Logging
  log_file: "data/output/llm/safegat_decisions.jsonl"

  # Backend/rate-limit controls
  llm_timeout: 20
  fallback_to_rl: false # on LLM errors, hold current legal phase instead of RL
  fallback_policy: "hold_current"
  min_call_interval_s: 15.0
  backoff_wait_s: 75.0
  max_backoff_retries: 1
  rate_limit_cooldown_steps: 60
  rate_limit_cooldown_s: 300
  tpm_limit: 4500

  # Scenario detector thresholds
  queue_spike_threshold: 0.85
  zero_fraction_corruption_threshold: 0.90
  forecast_anomaly_threshold: 0.65
  forecast_horizon_steps: 3
  forecast_history_len: 4

  # Anomaly tags that trigger gate even if confidence is high
  anomaly_triggers:
    - emergency_vehicle
    - accident_flag
    - possible_packet_loss
    - nan_observation
    - queue_spike
    - forecast_anomaly
